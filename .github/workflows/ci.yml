name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: The measured numbers in docs/WHAT-FELTKIT-GIVES-YOU.md match the code
        run: npm run measure -- --check
      - name: Tests (the app on FeltKit's real runtime and an isolated database)
        run: npm test
      - name: Build the web app
        run: npm run build
      - name: Build the Chrome extension
        run: npm run extension:build
