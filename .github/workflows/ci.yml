name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Every platform package is installed exactly once (no nested second copy in the lockfile)
        run: |
          node -e '
            const lock = require("./package-lock.json").packages;
            const want = ["@feltdb/feltkit", "@appport/services", "@appport/resolver-client", "@appport/resolver-core"];
            let bad = 0;
            for (const name of want) {
              const copies = Object.keys(lock).filter((k) => k.endsWith("node_modules/" + name)).map((k) => k + "@" + lock[k].version);
              console.log(name, copies.join(", "));
              if (copies.length !== 1) bad++;
            }
            process.exit(bad);'

      - name: The real Resolver server, the published package at its pinned version (tests/resolver)
        run: npm ci --prefix tests/resolver
      - name: The real AuthBoundry server, the published package at its pinned version (tests/authboundry)
        run: npm ci --prefix tests/authboundry && node -p "'@authboundry/core ' + require('./tests/authboundry/node_modules/@authboundry/core/package.json').version"
      - name: The generated API matches the code (feltkit codegen leaves no change)
        run: npx feltkit codegen && git diff --exit-code -- feltkit/_generated
      - name: Typecheck
        run: npm run typecheck
      - name: What the app is made of (feltkit measure; measure.json is current)
        run: npx feltkit measure --check
      - name: The measured section of docs/WHAT-FELTKIT-GIVES-YOU.md matches it
        run: npm run measure:doc -- --check
      - name: Tests, including delegated execution against the real AuthBoundry server (never skipped here)
        run: npm test
        env:
          REQUIRE_REAL_AUTHBOUNDRY: "1"
      - name: Build the web app
        run: npm run build
      - name: Build the Chrome extension
        run: npm run extension:build
